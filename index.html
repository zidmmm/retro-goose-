<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crash Bandicoot Adventure</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:"Trebuchet MS",sans-serif;color:#fff}
  canvas{display:block}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(70px + env(safe-area-inset-right));display:flex;flex-wrap:wrap;gap:4px clamp(10px,3vw,24px);font-size:clamp(15px,4.4vw,22px);font-weight:bold;text-shadow:2px 2px 0 #000;pointer-events:none}
  #msg{overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;padding:12px 0;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);text-align:center;font-size:20px;line-height:1.6}
  #msg h1{font-size:clamp(30px,6vw,56px);margin:0 0 12px;padding:0 16px;text-wrap:balance;color:#ffb347;text-shadow:4px 4px 0 #7a2e00}
  #msg::before,#msg::after{content:'';flex:1 0 0}   /* centres the content when it fits, and lets it scroll from the top when it doesn't */
  #msg.hidden{display:none}
  #msgbody{max-width:760px;padding:0 20px;font-size:clamp(14px,2.6vh,20px);line-height:1.5}
  #startBtn{flex:0 0 auto;margin:18px 0 6px;padding:14px 44px;font:bold 26px "Trebuchet MS",sans-serif;color:#2b1200;background:#ffb347;border:3px solid #7a2e00;border-radius:12px;box-shadow:0 5px 0 #7a2e00;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #startBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a2e00}
  #logo{width:min(80vw,520px);max-height:min(42vh,300px);flex:0 0 auto;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #touch{position:fixed;inset:auto 0 0 0;height:0;display:none;pointer-events:none}
  body.touch #touch{display:block}
  body:has(#msg:not(.hidden)) #touch,body:has(#mapStart:not([hidden])) #touch,body:has(#mapHint:not([hidden])) #touch,body:has(#intro) #touch{display:none}   /* no on-screen buttons over menus, the intro or the world map */
  #touch button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;pointer-events:auto;border:3px solid rgba(255,255,255,.7);background:rgba(20,30,40,.45);color:#fff;font:bold 30px "Trebuchet MS",sans-serif;border-radius:50%;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
  #touch button.down{background:rgba(255,179,71,.7)}
  :root{--d:clamp(50px,min(14vw,17vh),84px)}   /* touch-button unit: scales with the screen so phones in portrait or landscape fit */
  .dp{width:var(--d);height:var(--d);border-radius:calc(var(--d)*.22)!important;font-size:calc(var(--d)*.36)!important}
  #bU{left:calc(env(safe-area-inset-left) + var(--d)*1.35);bottom:calc(var(--d)*2.5 + 14px)}
  #bD{left:calc(env(safe-area-inset-left) + var(--d)*1.35);bottom:calc(var(--d)*.3 + 14px)}
  #bL{left:calc(env(safe-area-inset-left) + var(--d)*.25);bottom:calc(var(--d)*1.4 + 14px)}
  #bR{left:calc(env(safe-area-inset-left) + var(--d)*2.45);bottom:calc(var(--d)*1.4 + 14px)}
  #bJ{right:calc(env(safe-area-inset-right) + var(--d)*.35);bottom:calc(var(--d)*1.3 + 14px);width:calc(var(--d)*1.4);height:calc(var(--d)*1.4);font-size:calc(var(--d)*.27)!important}
  #bS{right:calc(env(safe-area-inset-right) + var(--d)*1.95);bottom:calc(var(--d)*.4 + 14px);width:calc(var(--d)*1.2);height:calc(var(--d)*1.2);font-size:calc(var(--d)*.24)!important}
  #bossbar{position:fixed;top:calc(clamp(40px,7vh,54px) + env(safe-area-inset-top));max-width:94vw;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;filter:drop-shadow(2px 2px 0 #000)}
  #bossname{font-weight:bold;letter-spacing:.14em;font-size:clamp(12px,3.4vw,17px);color:#ff8a65;margin-bottom:4px}
  #bosshp{display:flex;gap:6px;justify-content:center}
  #bosshp i{display:block;width:clamp(22px,6vw,44px);height:clamp(13px,2.4vh,18px);background:linear-gradient(#ff7a6b,#c62828);border:3px solid #fff;border-radius:3px;transition:background .25s,opacity .25s}
  #bosshp i.lost{background:#1d1d1d;border-color:#777;opacity:.65}
  #muteBtn{position:fixed;z-index:20;top:calc(8px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(20,30,40,.55);color:#fff;font-size:22px;line-height:1;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
  #mapBanner{position:fixed;top:11%;left:0;right:0;text-align:center;font-size:clamp(26px,5.5vw,54px);font-weight:bold;color:#ffe28a;text-shadow:3px 3px 0 #5a2a00,-2px -2px 0 #5a2a00;pointer-events:none;padding:0 16px;text-wrap:balance}
  @media (max-width:520px),(max-height:480px){
    #muteBtn{width:38px;height:38px;font-size:18px;top:calc(6px + env(safe-area-inset-top))}
    #msgbody{font-size:clamp(12px,2.2vh,16px)!important;line-height:1.35}
    #logo{max-height:26vh}
    #startBtn{padding:10px 34px;font-size:22px;margin-top:10px}
    #msg h1{font-size:clamp(22px,5vw,36px)}
    #mapStart{padding:10px 40px;font-size:22px}
    #mapHint{font-size:12px}
  }
  #intro{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .7s;cursor:pointer;touch-action:manipulation}
  #intro.on{opacity:1}
  #intro img{width:min(78vw,60vh,560px);height:auto;opacity:0;transition:opacity .9s}
  #intro.show img{opacity:1}
  #intro p{margin:14px 0 0;font:bold clamp(20px,4.4vw,38px) "Trebuchet MS",sans-serif;letter-spacing:.12em;color:#222;opacity:0;transition:opacity .8s}
  #intro.show p{opacity:1}
  #mapStart{position:fixed;bottom:9%;left:50%;transform:translateX(-50%);padding:14px 56px;font:bold 28px "Trebuchet MS",sans-serif;color:#2b1200;background:#ffb347;border:3px solid #7a2e00;border-radius:12px;box-shadow:0 5px 0 #7a2e00;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #mapStart[hidden]{display:none}
  #mapStart:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #7a2e00}
  #mapHint{position:fixed;bottom:5%;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.14em;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
  #danger{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 110px 36px rgba(255,40,20,.85)}   /* red edges when the boulder is close */
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
  #fade.on{opacity:1}
  #toast{position:fixed;top:26%;left:0;right:0;padding:0 12px;text-wrap:balance;text-align:center;font-size:clamp(22px,6.5vw,44px);font-weight:bold;color:#ffd54f;text-shadow:3px 3px 0 #7a2e00;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;pointer-events:none}
  #toast.show{opacity:1;transform:scale(1)}
  kbd{background:#333;border:1px solid #888;border-radius:4px;padding:1px 7px}
</style>
</head>
<body>
<div id="hud"><span id="lives"></span><span id="fruit"></span><span id="crates"></span><span id="aku" style="color:#ffd54f"></span></div>
<div id="bossbar" hidden><div id="bossname">RIPPER ROO</div><div id="bosshp"></div></div>
<div id="mapBanner" hidden></div>
<button id="mapStart" type="button" hidden>START</button>
<div id="mapHint" hidden>TAP OR PRESS ENTER TO SKIP</div>
<div id="danger"></div>
<div id="fade"></div>
<button id="muteBtn" type="button" aria-label="Sound on or off">&#128266;</button>
<div id="toast"></div>
<div id="touch">
  <button id="bU" class="dp" data-key="ArrowUp">&#9650;</button><button id="bL" class="dp" data-key="ArrowLeft">&#9664;</button>
  <button id="bR" class="dp" data-key="ArrowRight">&#9654;</button><button id="bD" class="dp" data-key="ArrowDown">&#9660;</button>
  <button id="bJ" data-key="Space">JUMP</button><button id="bS" data-action="spin">SPIN</button>
</div>
<div id="intro"><img src="./assets/retro_goose.jpg" alt="Retro Goose"><p>RETRO GOOSE PRESENTS</p></div>
<div id="msg"><img id="logo" src="./assets/logo.png" alt="Crash Bandicoot Adventure"><h1 hidden></h1><div id="msgbody"></div><button id="startBtn" type="button">PLAY</button></div>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module" src="./main.js"></script>
</body>
</html>
