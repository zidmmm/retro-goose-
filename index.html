<head>

<title>Retro Run</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101820;font-family:"Trebuchet MS",sans-serif;color:#fff}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:16px;right:16px;display:flex;gap:24px;font-size:22px;font-weight:bold;text-shadow:2px 2px 0 #000;pointer-events:none}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);text-align:center;font-size:20px;line-height:1.6}
  #msg h1{font-size:56px;margin:0 0 12px;color:#ffb347;text-shadow:4px 4px 0 #7a2e00}
  #msg.hidden{display:none}
  kbd{background:#333;border:1px solid #888;border-radius:4px;padding:1px 7px}
</style>
</head>
<body>
<div id="hud"><span id="lives"></span><span id="fruit"></span><span id="crates"></span></div>
<div id="msg"><h1>RETRO RUN</h1><div id="msgbody"></div></div>
